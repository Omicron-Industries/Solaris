<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Solaris Web Map</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header id="topbar">
    <div id="brand">Solaris <span id="brand-sub">Web Map</span></div>

    <div id="loaders">
      <label class="file-btn">
        Load map file
        <input type="file" id="map-input" accept=".solmap" />
      </label>
      <label class="file-btn file-btn-secondary">
        Load waypoints (optional)
        <input type="file" id="waypoints-input" accept=".json" />
      </label>
    </div>

    <button id="settings-toggle" class="hidden" type="button">⚙ Settings</button>

    <div id="meta" class="hidden">
      <span id="meta-world"></span>
      <span id="meta-dim"></span>
      <span id="meta-date"></span>
      <span id="meta-waypoints"></span>
    </div>
  </header>

  <main id="stage">
    <div id="empty-state">
      <p>Drop a <code>.solmap</code> file here, or use the button above.</p>
      <p class="hint">Both files come from Solaris's "Export for Web Map" button on the in-game
        fullscreen map — nothing here is ever uploaded anywhere, it's all read locally in your
        browser.</p>
    </div>
    <canvas id="map-canvas"></canvas>
    <div id="tooltip" class="hidden"></div>
    <div id="coords" class="hidden"></div>
    <div id="scalebar" class="hidden">
      <div id="scalebar-line"></div>
      <div id="scalebar-label"></div>
    </div>

    <aside id="settings-panel" class="hidden">
      <div class="settings-header">
        <span>Settings</span>
        <button id="settings-close" type="button" aria-label="Close settings">&times;</button>
      </div>
      <div class="settings-body">

        <section class="settings-section">
          <h3>Display</h3>
          <label class="opt-slider">Saturation <span class="opt-val" id="val-saturation">1.00</span>
            <input type="range" id="opt-saturation" min="0" max="2" step="0.01" value="1" />
          </label>
          <label class="opt-slider">Contrast <span class="opt-val" id="val-contrast">1.00</span>
            <input type="range" id="opt-contrast" min="0.2" max="2.5" step="0.01" value="1" />
          </label>
          <label class="opt-slider">Brightness <span class="opt-val" id="val-brightness">1.00</span>
            <input type="range" id="opt-brightness" min="0.2" max="2.5" step="0.01" value="1" />
          </label>
          <label class="opt-slider">Tint Red <span class="opt-val" id="val-tint-r">1.00</span>
            <input type="range" id="opt-tint-r" min="0.3" max="2" step="0.01" value="1" />
          </label>
          <label class="opt-slider">Tint Green <span class="opt-val" id="val-tint-g">1.00</span>
            <input type="range" id="opt-tint-g" min="0.3" max="2" step="0.01" value="1" />
          </label>
          <label class="opt-slider">Tint Blue <span class="opt-val" id="val-tint-b">1.00</span>
            <input type="range" id="opt-tint-b" min="0.3" max="2" step="0.01" value="1" />
          </label>
          <label class="opt-toggle"><input type="checkbox" id="opt-bw" /> Black &amp; white</label>
          <label class="opt-toggle"><input type="checkbox" id="opt-vignette" /> Vignette</label>
          <label class="opt-slider">Vignette strength <span class="opt-val" id="val-vignette">0.50</span>
            <input type="range" id="opt-vignette-strength" min="0" max="1" step="0.01" value="0.5" />
          </label>
        </section>

        <section class="settings-section">
          <h3>Map</h3>
          <label class="opt-toggle"><input type="checkbox" id="opt-hillshade" checked /> Hillshading</label>
          <label class="opt-toggle"><input type="checkbox" id="opt-grid" /> Chunk grid</label>
        </section>

        <section class="settings-section">
          <h3>Unexplored areas</h3>
          <label class="opt-row">Style
            <select id="opt-style">
              <option value="FOG">Fog</option>
              <option value="STARFIELD">Starfield</option>
              <option value="PHOENIX">Phoenix</option>
              <option value="CLOUD">Cloud</option>
              <option value="IMAGE">Image</option>
            </select>
          </label>
          <label class="opt-slider">Density <span class="opt-val" id="val-unexplored-density">1.00</span>
            <input type="range" id="opt-unexplored-density" min="0.25" max="4" step="0.05" value="1" />
          </label>
          <label class="opt-slider">Brightness <span class="opt-val" id="val-unexplored-brightness">1.00</span>
            <input type="range" id="opt-unexplored-brightness" min="0.25" max="2.5" step="0.05" value="1" />
          </label>
          <label id="opt-image-row" class="opt-row hidden">
            <span class="file-btn file-btn-secondary">
              Choose image
              <input type="file" id="opt-unexplored-image" accept="image/*" />
            </span>
          </label>
          <label id="opt-image-cover-row" class="opt-toggle hidden">
            <input type="checkbox" id="opt-unexplored-cover" /> Cover whole map (instead of tiling)
          </label>
        </section>

      </div>
    </aside>
  </main>
</div>

<script src="app.js"></script>
</body>
</html>
