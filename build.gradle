buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        // GTCEu — optional ore-vein integration only, see integration.gtceu
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    flatDir {
        // Phoenix Guilds — optional guild-scoped waypoint sharing only, see integration.guilds.
        // Not a published artifact (a sibling repo, not on any Maven repo); Guilds' own
        // publishToSolaris Gradle task copies its jar in here directly, same local-jar pattern
        // Phoenix Domains already uses for its own dependency on Solaris.
        dir 'libs'
    }
    maven {
        // FramedBlocks + Copycats — optional camouflage-block map-color integrations only, see
        // integration.framedblocks / integration.copycats. Both publish to Modrinth's own maven
        // proxy (verified: no self-hosted maven for either).
        name = 'Modrinth Maven'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        // Domum Ornamentum — optional camouflage-block map-color integration only, see
        // integration.domumornamentum. LDTTeam's own maven (verified via their shared Gradle
        // conventions script, ldtteam/OperaPublicaCreator) — not on Modrinth/CurseForge maven.
        name = 'LDTTeam Maven'
        url = 'https://ldtteam.jfrog.io/ldtteam/mods-maven'
        content {
            includeGroup 'com.ldtteam'
        }
    }
}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
        client {
            client()
            sourceSet = sourceSets.main
            programArguments.addAll('--refresh-dependencies')
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        data {
            data()
            sourceSet = sourceSets.main
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
jar {
    manifest.attributes([
            "MixinConfigs": "solaris.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

dependencies {
    compileOnly("org.jetbrains:annotations:26.0.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Optional ore-vein integration — GTCEu isn't required to run Solaris, only to see its
    // veins on the map. See integration.gtceu for the isAvailable()-guarded access pattern.
    modCompileOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modRuntimeOnly("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }

    // Optional guild-scoped waypoint sharing — Phoenix Guilds isn't required to run Solaris,
    // only to share a waypoint to your guildmates. See integration.guilds for the
    // isAvailable()-guarded access pattern (mirrors the gtceu integration above).
    modCompileOnly 'local:phoenix_guilds:0.1.0'
    modRuntimeOnly 'local:phoenix_guilds:0.1.0'

    // Optional camouflage-block map-color integrations — none of these three are required to
    // run Solaris, only to render what a camouflaged/materially-textured block is actually
    // displaying instead of its own undefined placeholder color. See integration.framedblocks /
    // integration.copycats / integration.domumornamentum for the isAvailable()-guarded access
    // pattern (mirrors the gtceu integration above).
    modCompileOnly("maven.modrinth:framedblocks:9.4.3") { transitive = false }
    modRuntimeOnly("maven.modrinth:framedblocks:9.4.3") { transitive = false }

    // Copycats' own ICopycatBlockEntity interface extends several Create interfaces (which
    // themselves reach into Flywheel/Registrate/Catnip) — javac needs that whole chain
    // resolvable just to type-check a call to ICopycatBlockEntity's own methods, even though
    // none of it is actually used. Reflection (see integration.copycats) sidesteps needing any
    // of that on the compile classpath at all — no compileOnly dependency here, matching
    // GtceuIntegration's own reflection-based access to a third-party private field. Kept as a
    // dev-environment-only runtime dependency so integration.copycats is actually exercisable
    // via ./gradlew runClient; real users' modpacks bring their own Copycats jar.
    modRuntimeOnly("maven.modrinth:copycats:3.0.7+mc.1.20.1-forge") { transitive = false }

    modCompileOnly("com.ldtteam:domum_ornamentum:1.20.1-1.0.296:api") { transitive = false }
    modRuntimeOnly("com.ldtteam:domum_ornamentum:1.20.1-1.0.296:universal") { transitive = false }

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
}

tasks.named('processResources', ProcessResources).configure {
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}

tasks.register('publishToDomains', Copy) {
    group = 'phoenix'
    description = 'Builds this mod and copies the jar into ../Phoenix-Domains/libs, so Domains picks up local changes.'
    dependsOn 'reobfJar'
    from(layout.buildDirectory.dir('libs')) {
        include '*.jar'
        exclude '*-sources.jar'
    }
    into '../Phoenix-Domains/libs'
}
